[package]
name = "hmleq-cli"
version = "0.2.1"
edition = "2021"
description = "CLI for hmleq: convert HWP equation script to LaTeX or a JSON AST"
license = "MIT"
repository = "https://github.com/Hwi0228/hmleqx"

[[bin]]
name = "hmleq"
path = "src/main.rs"

[dependencies]
hmleq = { path = "..", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
